name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          - goos: darwin
            goarch: amd64
            suffix: darwin-amd64
          - goos: darwin
            goarch: arm64
            suffix: darwin-arm64
          - goos: windows
            goarch: amd64
            suffix: windows-amd64
            ext: .exe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Run tests
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          go build -o vyrc bootstrap/vyrc.go
          make test

      - name: Build vyrc
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -o vyrc-${{ matrix.suffix }}${{ matrix.ext }} bootstrap/vyrc.go

      - name: Package release
        run: |
          mkdir -p dist/vyr
          cp vyrc-${{ matrix.suffix }}${{ matrix.ext }} dist/vyr/vyrc${{ matrix.ext }}
          cp -r runtime dist/vyr/
          cp -r std dist/vyr/
          cp vyr dist/vyr/ 2>/dev/null || true
          cp README.md dist/vyr/
          cd dist && tar czf ../vyr-${{ matrix.suffix }}.tar.gz vyr/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vyr-${{ matrix.suffix }}
          path: vyr-${{ matrix.suffix }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: vyr-*.tar.gz

  docs:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate docs
        run: python3 scripts/gendocs.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
